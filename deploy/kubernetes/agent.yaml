# Example only: replace the image with your published build pinned by digest.
# Create harness-credentials separately with api-server-key and model-api-key.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: harness-home
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanillacore-harness
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: vanillacore-harness}
  template:
    metadata:
      labels: {app: vanillacore-harness}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: harness
          image: registry.example.org/vanillacore-harness:replace-me
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef: {name: harness-credentials, key: api-server-key}
            - name: MODEL_API_KEY
              valueFrom:
                secretKeyRef: {name: harness-credentials, key: model-api-key}
          ports:
            - {name: api, containerPort: 8642}
          readinessProbe:
            httpGet: {path: /health, port: api}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: '2', memory: 4Gi}
          volumeMounts:
            - {name: home, mountPath: /home/node}
            - {name: config, mountPath: /home/node/.vanillacore-harness/harness.yaml, subPath: harness.yaml, readOnly: true}
            - {name: config, mountPath: /home/node/.vanillacore-harness/SOUL.md, subPath: SOUL.md, readOnly: true}
            - {name: config, mountPath: /home/node/.pi/agent/models.json, subPath: models.json, readOnly: true}
      volumes:
        - name: home
          persistentVolumeClaim: {claimName: harness-home}
        - name: config
          configMap: {name: harness-config}
---
apiVersion: v1
kind: Service
metadata:
  name: vanillacore-harness
spec:
  selector: {app: vanillacore-harness}
  ports:
    - {name: api, port: 8642, targetPort: api}
